    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "EdgeifyAI",
      "url": "https://edgeifyai.com",
      "logo": "https://edgeifyai.com/favicon.svg",
      "description": "EdgeifyAI builds voice calling, voice chat, chat, vision, RAG, and computer-use AI agents.",
      "sameAs": [
        "https://www.linkedin.com/company/edgeifyai"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@edgeifyai.com",
        "contactType": "sales"
      },
      "offers": {
        "@type": "AggregateOffer",
        "description": "AI Agent Development Services",
        "offerCount": "6",
        "offers": [
          { "@type": "Offer", "name": "Voice Calling Agents", "description": "AI agents that answer and place phone calls, book appointments, and qualify leads" },
          { "@type": "Offer", "name": "Voice Chat Agents", "description": "Real-time speech-to-speech assistants for websites and apps" },
          { "@type": "Offer", "name": "Chat Agents", "description": "Omnichannel agents for web, WhatsApp, Slack, and email" },
          { "@type": "Offer", "name": "Vision Agents", "description": "Multimodal agents that understand images, documents, and video" },
          { "@type": "Offer", "name": "RAG Knowledge Agents", "description": "Agents grounded in your own data with cited answers" },
          { "@type": "Offer", "name": "Computer-Use Agents", "description": "Agents that operate browsers and desktop apps to complete workflows" }
        ]
      }
    }
    </script>
